<!DOCTYPE html>
<html lang="hr">
<head>

    <title>Katalog Računalnih Komponenta</title>
    <link rel="stylesheet" href="dist/output.css">
    <script type="module" src="js/main.js"></script>

<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">
    
    <main class="w-full max-w-5xl p-4 flex flex-col items-center mx-auto">

        <header class="mb-4">
            <h1 class="text-2xl font-bold ">Katalog Računalnih Komponenti</h1>

        <p id="loading">Učitavanje Kataloga</p>

        <div id="list" class=" w-full grid gap-4 sm:grid-cols-2 md:grid-cols-3 justify-center"></div>

        <p id="empty" class="hidden rounded-lg bg-white p-4 text-center">
            Ovdje nema računalnih komponenti.
        </p>

    </main>
    


</body>
</html>
